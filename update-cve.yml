name: Update CVE snapshot
on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-cve
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional; add under Settings > Secrets and variables > Actions
        run: python scripts/fetch_cve.py
      - name: Commit if changed
        run: |
          git config user.name "bteem-bot"
          git config user.email "bteem-bot@users.noreply.github.com"
          git add data/cve-snapshot.json
          git diff --cached --quiet || (git commit -m "Update CVE snapshot" && git push)
