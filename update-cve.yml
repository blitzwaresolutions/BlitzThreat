# BTEEM_BASE2_111626a
name: Update CVE snapshot
on:
  schedule:
    - cron: "0 6 * * *"          # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Force the 30-day reconcile pull"
        type: boolean
        default: false
permissions:
  contents: write                # needed to commit the data files; GitHub cannot scope this to specific paths
concurrency:
  group: update-cve
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to exact commits (v6.1.0 and v6.3.0). Update them deliberately, not automatically.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6.1.0
        with:
          persist-credentials: false       # the token is not left in .git/config for later steps
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - name: Self-test (mocked sources, no network)
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Ingest
        id: ingest
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}      # optional; Settings > Secrets and variables > Actions
          BTEEM_FULL: ${{ inputs.full_refresh && '1' || '' }}
        run: python scripts/fetch_cve.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}                # write token is used only in this step
        run: |
          git config user.name "bteem-bot"
          git config user.email "bteem-bot@users.noreply.github.com"
          git add -A -- data
          git diff --cached --quiet || (git commit -m "Update CVE snapshot $(date -u +%F)" \
            && git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}")
      - name: Report failure
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "Ingestion failed. The last good snapshot was kept and data/ingest-status.json records the failure."
          exit 1
